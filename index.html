<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlMaster | Login</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        ar: ['Cairo', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            main: '#0047ff',
                            dark: '#002fcc',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #ffffff;
            transition: background-color 1s ease-in-out;
            user-select: none;
            overflow: hidden;
        }
        .drag-region {
            -webkit-app-region: drag; 
            position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 1000;
        }
        .no-drag { -webkit-app-region: no-drag; }
        
        /* Smooth cubic-bezier transitions from React code */
        .transition-interactive {
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body id="body-container">

    <!-- Electron Drag Region -->
    <div class="drag-region flex justify-end px-4">
        <button onclick="window.close()" class="no-drag text-slate-400 hover:text-red-500 transition-colors mt-3">
            <i class="fas fa-times text-lg"></i>
        </button>
    </div>

    <!-- Main Wrapper mirroring React structure -->
    <div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden transition-interactive">
        
        <!-- Animated gradient background (subtle) -->
        <div class="absolute inset-0 w-full h-full bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/50 via-white to-white pointer-events-none"></div>

        <div class="absolute inset-0 w-full h-full flex items-center justify-center z-10">
            
            <!-- Interactive Container -->
            <div id="interactive-container" class="relative flex items-center justify-center gap-0 transition-interactive">
                
                <!-- Logo Section -->
                <div id="logo-section" class="flex flex-col items-center justify-center cursor-pointer hover:scale-110 transition-interactive scale-100" onclick="revealLogin()">
                    <div class="relative">
                        <!-- Blur Background -->
                        <div id="logo-blur" class="absolute rounded-full blur-[60px] transition-all duration-1000 bg-brand-main/30 w-[150%] h-[150%] -left-1/4 -top-1/4 animate-pulse"></div>
                        
                        <img src="MASTER_LOGO_WHPNG.png" alt="AlMaster Logo Mark" class="relative z-10 object-contain drop-shadow-xl w-[200px] h-[200px] md:w-[300px] md:h-[300px]" onerror="this.src='https://ui-avatars.com/api/?background=0047ff&color=fff&name=AM&size=300'">
                    </div>
                    
                    <!-- Full Text appearing beneath -->
                    <div id="logo-text" class="overflow-hidden transition-all duration-1000 ease-in-out flex justify-center mt-6 opacity-0 max-h-0">
                        <h2 class="text-3xl font-black text-brand-main tracking-widest drop-shadow-sm">ALMASTER</h2>
                    </div>
                </div>

                <!-- Login Form Section -->
                <div id="form-section" class="opacity-0 translate-x-12 blur-md pointer-events-none absolute transition-all duration-1000 delay-300 ease-[cubic-bezier(0.16,1,0.3,1)]">
                    
                    <!-- Login View -->
                    <div id="login-view" class="bg-white/70 backdrop-blur-xl border border-white p-8 rounded-[24px] shadow-[0_30px_60px_-15px_rgba(0,71,255,0.1)] w-[360px] md:w-[420px] relative">
                        <div class="flex flex-col gap-2 text-center mb-8">
                            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
                            <p class="text-sm font-medium text-slate-500">Please sign in to access the system</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="flex flex-col gap-5">
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider ml-1">Username</label>
                                <input type="email" id="login-email" placeholder="Enter your email" required
                                    class="no-drag w-full h-12 bg-white/50 border border-slate-200 rounded-[12px] px-4 text-sm font-medium outline-none focus:border-brand-main focus:ring-4 focus:ring-brand-main/10 transition-all placeholder:font-normal">
                            </div>

                            <div class="flex flex-col gap-2">
                                <div class="flex items-center justify-between ml-1">
                                    <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                                    <button type="button" onclick="switchAuthView('reset')" class="no-drag text-xs font-bold text-brand-main hover:underline">
                                        Forgot Password?
                                    </button>
                                </div>
                                <div class="relative">
                                    <input type="password" id="login-pass" placeholder="Enter your password" required
                                        class="no-drag w-full h-12 bg-white/50 border border-slate-200 rounded-[12px] pl-4 pr-12 text-sm font-medium outline-none focus:border-brand-main focus:ring-4 focus:ring-brand-main/10 transition-all placeholder:font-normal">
                                    <button type="button" onclick="togglePassword()" class="no-drag absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 outline-none p-1">
                                        <i id="eye-icon" class="fas fa-eye text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Error Message -->
                            <div id="login-error" class="hidden text-center mt-1">
                                <p id="error-text" class="text-xs font-bold text-red-500"></p>
                            </div>

                            <button type="submit" id="login-btn" class="no-drag mt-2 w-full h-12 rounded-[12px] bg-gradient-to-r from-brand-main to-brand-dark text-white font-bold text-sm shadow-lg shadow-brand-main/30 hover:shadow-brand-main/50 transition-all active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2">
                                <span>Sign In</span>
                            </button>
                        </form>
                    </div>

                    <!-- Reset Password View -->
                    <div id="reset-view" class="hidden bg-white/70 backdrop-blur-xl border border-white p-8 rounded-[24px] shadow-[0_30px_60px_-15px_rgba(0,71,255,0.1)] w-[360px] md:w-[420px] relative animate-fade-in">
                        <button type="button" onclick="switchAuthView('login')" class="no-drag mb-6 text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-2 font-bold text-sm">
                            <i class="fas fa-arrow-left"></i> Back to login
                        </button>
                        
                        <div class="flex flex-col gap-2 text-center mb-8">
                            <h1 class="text-2xl font-bold text-slate-900">Reset Password</h1>
                            <p class="text-sm font-medium text-slate-500">We'll send you a link to reset it.</p>
                        </div>

                        <form onsubmit="handlePasswordReset(event)" class="flex flex-col gap-5">
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider ml-1">Email Address</label>
                                <input type="email" id="reset-email" placeholder="Enter your email" required
                                    class="no-drag w-full h-12 bg-white/50 border border-slate-200 rounded-[12px] px-4 text-sm font-medium outline-none focus:border-brand-main focus:ring-4 focus:ring-brand-main/10 transition-all placeholder:font-normal">
                            </div>

                            <div id="reset-msg" class="hidden text-center mt-1">
                                <p id="reset-text" class="text-xs font-bold text-brand-main"></p>
                            </div>

                            <button type="submit" id="reset-btn" class="no-drag mt-2 w-full h-12 rounded-[12px] bg-gradient-to-r from-brand-main to-brand-dark text-white font-bold text-sm shadow-lg shadow-brand-main/30 hover:shadow-brand-main/50 transition-all active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2">
                                <span>Send Reset Link</span>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script>
        let isRevealed = false;
        
        function revealLogin() {
            if (isRevealed) return;
            isRevealed = true;
            
            // Background
            document.getElementById('body-container').style.backgroundColor = '#f8fafc';
            
            // Container Layout
            const container = document.getElementById('interactive-container');
            container.classList.remove('gap-0');
            container.classList.add('gap-12', 'md:gap-24', 'flex-col', 'md:flex-row');

            // Logo Animation
            const logoSec = document.getElementById('logo-section');
            logoSec.classList.remove('hover:scale-110');
            logoSec.classList.add('cursor-default');

            const logoBlur = document.getElementById('logo-blur');
            logoBlur.classList.remove('bg-brand-main/30', 'w-[150%]', 'h-[150%]', '-left-1/4', '-top-1/4', 'animate-pulse');
            logoBlur.classList.add('bg-brand-main/5', 'w-[200%]', 'h-[200%]', '-left-1/2', '-top-1/2');

            const logoText = document.getElementById('logo-text');
            logoText.classList.remove('opacity-0', 'max-h-0');
            logoText.classList.add('opacity-100', 'max-h-[80px]');

            // Form Animation
            const formSec = document.getElementById('form-section');
            formSec.classList.remove('opacity-0', 'translate-x-12', 'blur-md', 'pointer-events-none', 'absolute');
            formSec.classList.add('opacity-100', 'translate-x-0', 'blur-none', 'pointer-events-auto');
        }

        function togglePassword() {
            const input = document.getElementById('login-pass');
            const icon = document.getElementById('eye-icon');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function switchAuthView(view) {
            const loginV = document.getElementById('login-view');
            const resetV = document.getElementById('reset-view');
            if (view === 'reset') {
                loginV.classList.add('hidden');
                resetV.classList.remove('hidden');
            } else {
                resetV.classList.add('hidden');
                loginV.classList.remove('hidden');
            }
        }

        // Firebase Auth Config
        const firebaseConfig = { apiKey: "AIzaSyCXyuT529aGwiS5j_RPxW_zEeAtkYc7JlM", authDomain: "almaster-b8c18.firebaseapp.com", projectId: "almaster-b8c18", storageBucket: "almaster-b8c18.firebasestorage.app", messagingSenderId: "884142036232", appId: "1:884142036232:web:eeb6677d988565653a08bd" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const btn = document.getElementById('login-btn');
                if (btn) btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-lg"></i>';
                await redirectUserBasedOnRole(user.email);
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.toLowerCase().trim();
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');
            const errorBox = document.getElementById('login-error');
            const errorText = document.getElementById('error-text');
            
            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-lg"></i>';

            try {
                await auth.signInWithEmailAndPassword(email, pass);
                const newSessionId = Date.now() + "_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('my_session_id', newSessionId);
                await db.collection('users').doc(email).update({ sessionId: newSessionId }, { merge: true });
                // Redirect handled by onAuthStateChanged
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In</span>';
                errorText.innerText = "Invalid email or password.";
                errorBox.classList.remove('hidden');
            }
        }

        async function handlePasswordReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.toLowerCase().trim();
            const btn = document.getElementById('reset-btn');
            const msgBox = document.getElementById('reset-msg');
            const msgText = document.getElementById('reset-text');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';

            try {
                await auth.sendPasswordResetEmail(email);
                msgText.className = "text-xs font-bold text-green-600";
                msgText.innerText = "Reset link sent! Please check your email.";
                msgBox.classList.remove('hidden');
                btn.innerHTML = '<span>Sent Successfully</span>';
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>Send Reset Link</span>';
                msgText.className = "text-xs font-bold text-red-500";
                msgText.innerText = "Error: Email not found or invalid.";
                msgBox.classList.remove('hidden');
            }
        }

        async function redirectUserBasedOnRole(email) {
            try {
                const userDoc = await db.collection('users').doc(email.toLowerCase()).get();
                if (!userDoc.exists) throw new Error("User Not Found");
                
                const role = userDoc.data().role || 'employee';
                const pages = { 'admin': 'admin.html', 'supervisor': 'supervisor.html', 'leader': 'leader.html', 'employee': 'employee.html' };
                
                window.location.replace(pages[role] || 'employee.html');
            } catch (error) {
                auth.signOut();
                const btn = document.getElementById('login-btn');
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign In</span>';
                }
                const errorBox = document.getElementById('login-error');
                const errorText = document.getElementById('error-text');
                if (errorBox && errorText) {
                    errorText.innerText = "Account permissions error.";
                    errorBox.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
