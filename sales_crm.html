<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales CRM - Almaster</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            blueLt: '#3b82f6',
                            navy: '#0f172a',
                            navy2: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #64748b; }

        /* Notion-like Table Styles */
        .crm-table { border-collapse: collapse; width: 100%; text-align: left; }
        .crm-table th, .crm-table td { 
            border: 1px solid theme('colors.slate.700'); 
            padding: 10px 14px; 
            white-space: nowrap; 
        }
        .crm-table th {
            background: theme('colors.slate.800');
            color: theme('colors.slate.300');
            font-weight: 700;
            font-size: 13px;
        }
        .crm-table tr:hover { background: theme('colors.slate.800/50'); }
        .crm-table td { font-size: 13px; color: theme('colors.slate.200'); }

        /* Light mode overrides */
        html:not(.dark) .crm-table th, html:not(.dark) .crm-table td { border-color: theme('colors.slate.200'); }
        html:not(.dark) .crm-table th { background: theme('colors.slate.100'); color: theme('colors.slate.600'); }
        html:not(.dark) .crm-table tr:hover { background: theme('colors.slate.50'); }
        html:not(.dark) .crm-table td { color: theme('colors.slate.700'); }
        
        .chip { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-200 h-screen flex overflow-hidden">

    <!-- Sidebar -->

            <h1 class="text-lg font-black tracking-tight text-slate-800 dark:text-white">Sales<span class="text-brand-blueLt"> CRM</span></h1>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="window.location.href='sales_crm.html'" id="nav-leads" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm bg-brand-blue/10 dark:bg-brand-blue/20 text-brand-blueLt transition-all">

                <i class="fas fa-file-invoice w-5 text-center"></i> Reports
            </button>
            
            <!-- Admin Only Option -->
            <button onclick="window.location.href='admin.html'" id="nav-settings" style="display: none;" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all mt-4 border border-slate-200 dark:border-slate-700">
                <i class="fas fa-cog w-5 text-center"></i> Manage Access

        </nav>
        
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">

        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 dark:bg-slate-900">

            <div class="flex items-center gap-4">

                    <p id="user-role" class="text-[10px] text-brand-blueLt font-bold uppercase">CRM Agent</p>
                </div>
                <img id="user-avatar" src="" class="w-9 h-9 rounded-full object-cover bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600" onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'">
            </div>
        </header>

        <!-- Dynamic Tabs Container -->

                        <button onclick="applyFilter('status', 'New')" id="filter-new" class="filter-btn px-4 py-1.5 rounded-lg bg-transparent text-slate-500 dark:text-slate-400 text-sm font-bold hover:bg-slate-200 dark:hover:bg-slate-800 transition">New Leads</button>
                        <button onclick="applyFilter('status', 'Negotiation')" id="filter-neg" class="filter-btn px-4 py-1.5 rounded-lg bg-transparent text-slate-500 dark:text-slate-400 text-sm font-bold hover:bg-slate-200 dark:hover:bg-slate-800 transition">In Negotiation</button>

                            <option value="Magda">Magda</option>
                            <option value="Mohamed">Mohamed</option>
                            <option value="Kholoud">Kholoud</option>
                            <option value="Mustafa">Mustafa</option>

                    <button onclick="openLeadModal()" class="px-4 py-2 bg-brand-blue hover:bg-brand-blueLt text-white rounded-lg text-sm font-bold shadow-md transition-colors flex items-center gap-2">

                </div>
                
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-auto custom-scrollbar flex-1 shadow-sm relative">

                            <tr>
                                <th class="cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition" onclick="sortTable('company')"><i class="fas fa-building mr-1 text-slate-400"></i> Company / Client <i class="fas fa-sort ml-1 opacity-50"></i></th>

                                <th><i class="fas fa-phone mr-1 text-slate-400"></i> Phone</th>
                                <th class="cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition" onclick="sortTable('source')"><i class="fas fa-filter mr-1 text-slate-400"></i> Source <i class="fas fa-sort ml-1 opacity-50"></i></th>

                                <th class="cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition" onclick="sortTable('value')"><i class="fas fa-money-bill mr-1 text-slate-400"></i> Value <i class="fas fa-sort ml-1 opacity-50"></i></th>
                                <th class="cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition" onclick="sortTable('nextActionDate')"><i class="fas fa-calendar-check mr-1 text-slate-400"></i> Next Action <i class="fas fa-sort ml-1 opacity-50"></i></th>

                        <tbody id="crm-table-body">
                            <tr><td colspan="9" class="text-center py-8 text-slate-500">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Lead Modal (Add/Edit) -->
            <div id="leadModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

                    </div>

                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Company / Client Name *</label><input type="text" id="company" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Contact Person</label><input type="text" id="contactPerson" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Job Title</label><input type="text" id="contactTitle" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Phone Number (with code) *</label><input type="tel" id="phone" placeholder="+966" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Email Address</label><input type="email" id="email" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                            </div>
                            
                            <!-- CRM specific -->
                            <div class="space-y-4">
                                <h4 class="font-bold text-brand-blueLt border-b border-slate-200 dark:border-slate-700 pb-2"><i class="fas fa-chart-line"></i> Sales Categorization</h4>

                                    <datalist id="countriesList">
                                        <option value="Saudi Arabia"><option value="Egypt"><option value="UAE"><option value="Kuwait"><option value="Qatar"><option value="Bahrain"><option value="Oman"><option value="Jordan">
                                    </datalist>
                                </div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Sector</label><input type="text" id="sector" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Lead Source *</label>

                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Status *</label>

                                        <option value="New">New</option><option value="Negotiation">Negotiation</option><option value="Closed (Won)">Closed (Won)</option><option value="Lost">Lost</option>
                                    </select>
                                </div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Assigned Employee *</label>
                                    <select id="assignedEmployee" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none">
                                        <option value="Magda">Magda</option><option value="Mohamed">Mohamed</option><option value="Kholoud">Kholoud</option><option value="Mustafa">Mustafa</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Followup & Financial -->
                            <div class="space-y-4">
                                <h4 class="font-bold text-brand-blueLt border-b border-slate-200 dark:border-slate-700 pb-2"><i class="fas fa-calendar-alt"></i> Follow-up & Financials</h4>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">First Contact Date</label><input type="datetime-local" id="firstContactDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Last Follow-up Date</label><input type="datetime-local" id="lastFollowUp" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Next Action Date</label><input type="datetime-local" id="nextActionDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                <div class="flex gap-2">
                                    <div class="flex-1"><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Project Value</label><input type="number" id="value" min="0" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                                    <div class="w-24"><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Currency</label>
                                        <select id="currency" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none">
                                            <option value="SAR">SAR</option><option value="EGP">EGP</option><option value="USD">USD</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Full width details -->
                        <div class="mt-6 space-y-4">
                            <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Project Details</label><textarea id="projectDetails" rows="2" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none custom-scrollbar"></textarea></div>
                            <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Last Feedback</label><textarea id="lastFeedback" rows="2" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none custom-scrollbar"></textarea></div>
                            <div><label class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">Next Action Required</label><input type="text" id="nextAction" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-800 dark:text-white focus:border-brand-blueLt outline-none"></div>
                        </div>
                    </form>
                    <div class="p-6 border-t border-slate-200 dark:border-slate-700 shrink-0 flex justify-end gap-3 bg-slate-50 dark:bg-slate-800/50 rounded-b-2xl">
                        <button type="button" onclick="closeLeadModal()" class="px-6 py-2.5 rounded-lg font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">Cancel</button>
                        <button type="submit" form="leadForm" id="saveBtn" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg font-bold shadow-md transition flex items-center gap-2">
                            <i class="fas fa-save"></i> Save Lead
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

            'قيد التفاوض': 'bg-amber-500/20 text-amber-500',
            'مغلق (نجاح)': 'bg-emerald-500/20 text-emerald-500',
            'مستبعد (خسارة)': 'bg-slate-500/20 text-slate-500'
        };

        // Initialize Firebase Listener
        function initCRM() {
            db.collection('sales_leads').onSnapshot(snapshot => {
                leadsData = [];
                snapshot.forEach(doc => {
                    leadsData.push({ id: doc.id, ...doc.data() });
                });
                renderLeads();
            }, error => {
                console.error("Error fetching leads: ", error);
                Swal.fire('Error', 'Could not fetch data from the server.', 'error');
            });
        }

        // Sorting
        function sortTable(col) {
            if (currentSortCol === col) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortCol = col;
                currentSortAsc = true;
            }
            renderLeads();
        }

        // Filtering
        function applyFilter(key, value = 'all') {
            currentFilter = { key, value };
            
            // Update UI buttons if status filter
            if(key === 'all' || key === 'status') {
                const isDark = document.documentElement.classList.contains('dark');
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('bg-slate-200', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-white', 'border', 'border-slate-300', 'dark:border-slate-600');
                    btn.classList.add('bg-transparent', 'text-slate-500', 'dark:text-slate-400');
                });
                
                let activeBtn;
                if(key === 'all') activeBtn = document.getElementById('filter-all');
                else if(value === 'New') activeBtn = document.getElementById('filter-new');
                else if(value === 'Negotiation') activeBtn = document.getElementById('filter-neg');
                
                if (activeBtn) {
                    activeBtn.classList.add('bg-slate-200', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-white', 'border', 'border-slate-300', 'dark:border-slate-600');
                    activeBtn.classList.remove('bg-transparent', 'text-slate-500', 'dark:text-slate-400');
                }
            }
            renderLeads();
        }

        // Render Table
        function renderLeads() {
            let processed = [...leadsData];
            
            // Apply Filter
            if (currentFilter.key !== 'all') {
                processed = processed.filter(lead => lead[currentFilter.key] === currentFilter.value);
            }
            // Employee filter is a separate dropdown, apply it on top if not "all"
            const empVal = document.getElementById('emp-filter').value;
            if(empVal !== 'all') {
                processed = processed.filter(lead => lead.assignedEmployee === empVal);
            }

            // Apply Sort
            processed.sort((a, b) => {
                let valA = a[currentSortCol] || '';
                let valB = b[currentSortCol] || '';
                if(currentSortCol === 'value') { valA = Number(valA); valB = Number(valB); }
                if (valA < valB) return currentSortAsc ? -1 : 1;
                if (valA > valB) return currentSortAsc ? 1 : -1;
                return 0;
            });

            const tbody = document.getElementById('crm-table-body');
            if(processed.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-500">No matching data found</td></tr>';
                return;
            }

            tbody.innerHTML = processed.map(l => {
                const dateStr = l.firstContactDate ? new Date(l.firstContactDate).toLocaleDateString('en-US') : '-';
                const nextActStr = l.nextActionDate ? new Date(l.nextActionDate).toLocaleDateString('en-US') : '-';
                const colorClass = statusColors[l.status] || 'bg-slate-500/20 text-slate-500';
                
                return `
                <tr class="cursor-pointer transition-colors" onclick="openLeadModal('${l.id}')">
                    <td class="font-bold">${l.company || '-'}</td>
                    <td>${l.contactPerson || '-'}</td>
                    <td>${dateStr}</td>
                    <td>${l.phone || '-'}</td>
                    <td>${l.source || '-'}</td>
                    <td class="font-bold text-brand-blueLt">${l.assignedEmployee || '-'}</td>
                    <td><span class="chip ${colorClass}">${l.status || '-'}</span></td>
                    <td class="font-bold text-emerald-500">${l.value || 0} ${l.currency || 'SAR'}</td>
                    <td class="text-xs font-bold">${l.nextAction || '-'} <br><span class="text-[10px] text-slate-400">${nextActStr}</span></td>
                </tr>
            `}).join('');
        }

        // Modal Logic
        function openLeadModal(id = null) {
            document.getElementById('leadForm').reset();
            document.getElementById('leadId').value = '';
            document.getElementById('modalTitle').innerText = 'Add New Lead';
            
            if(id) {
                const lead = leadsData.find(l => l.id === id);
                if(lead) {
                    document.getElementById('modalTitle').innerText = 'Edit Lead Details';
                    document.getElementById('leadId').value = lead.id;
                    Object.keys(lead).forEach(key => {
                        const el = document.getElementById(key);
                        if(el) el.value = lead[key];
                    });
                }
            } else {
                // set defaults for new
                document.getElementById('status').value = 'New';
            }
            
            document.getElementById('leadModal').classList.remove('hidden');
        }

        function closeLeadModal() {
            document.getElementById('leadModal').classList.add('hidden');
        }

        async function saveLead(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const id = document.getElementById('leadId').value;
            const data = {
                company: document.getElementById('company').value,
                contactPerson: document.getElementById('contactPerson').value,
                contactTitle: document.getElementById('contactTitle').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                country: document.getElementById('country').value,
                sector: document.getElementById('sector').value,
                source: document.getElementById('source').value,
                status: document.getElementById('status').value,
                assignedEmployee: document.getElementById('assignedEmployee').value,
                firstContactDate: document.getElementById('firstContactDate').value,
                lastFollowUp: document.getElementById('lastFollowUp').value,
                nextActionDate: document.getElementById('nextActionDate').value,
                value: Number(document.getElementById('value').value || 0),
                currency: document.getElementById('currency').value,
                projectDetails: document.getElementById('projectDetails').value,
                lastFeedback: document.getElementById('lastFeedback').value,
                nextAction: document.getElementById('nextAction').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if(id) {
                    await db.collection('sales_leads').doc(id).update(data);
                    Swal.fire({ icon: 'success', title: 'Updated!', text: 'Lead details updated successfully.', timer: 1500, showConfirmButton: false });
                } else {
                    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('sales_leads').add(data);
                    Swal.fire({ icon: 'success', title: 'Added!', text: 'Lead added successfully.', timer: 1500, showConfirmButton: false });
                }
                closeLeadModal();
            } catch (error) {
                console.error("Error saving document: ", error);
                Swal.fire('Error', 'An error occurred while saving.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Save Lead';
            }
        }
        
        // Authentication Check
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.replace('index.html'); return; }
            try {
                const doc = await db.collection('users').doc(user.email.toLowerCase().trim()).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (!data.permissions || !data.permissions.crm) {
                        Swal.fire({ icon:'error', title:'Unauthorized', text:'You do not have permission to access the CRM.', allowOutsideClick: false }).then(() => {
                            window.location.replace('index.html');
                        });
                        return;
                    }
                    
                    const userName = data.name || user.email.split('@')[0];
                    document.getElementById('user-name').innerText = userName;
                    document.getElementById('user-role').innerText = `CRM ${data.permissions.crmRole || 'Agent'}`;
                    document.getElementById('user-avatar').src = data.profileImage || `https://ui-avatars.com/api/?name=${userName}&background=random`;
                    
                    if(data.permissions.crmRole === 'admin') {
                        document.getElementById('nav-settings').style.display = 'flex';
                    }
                    
                    // Start fetching CRM data
                    initCRM();
                }
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
