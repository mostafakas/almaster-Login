<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales CRM - Almaster</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            blueLt: '#3b82f6',
                            navy: '#0f172a',
                            navy2: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #64748b; }

        /* Notion-like Table Styles */
        .crm-table { border-collapse: collapse; width: 100%; text-align: right; }
        .crm-table th, .crm-table td { 
            border: 1px solid theme('colors.slate.700'); 
            padding: 10px 14px; 
            white-space: nowrap; 
        }
        .crm-table th {
            background: theme('colors.slate.800');
            color: theme('colors.slate.300');
            font-weight: 700;
            font-size: 13px;
        }
        .crm-table tr:hover { background: theme('colors.slate.800/50'); }
        .crm-table td { font-size: 13px; color: theme('colors.slate.200'); }

        /* Light mode overrides */
        html:not(.dark) .crm-table th, html:not(.dark) .crm-table td { border-color: theme('colors.slate.200'); }
        html:not(.dark) .crm-table th { background: theme('colors.slate.50'); color: theme('colors.slate.600'); }
        html:not(.dark) .crm-table tr:hover { background: theme('colors.slate.50'); }
        html:not(.dark) .crm-table td { color: theme('colors.slate.700'); }
        
        .chip { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 dark:bg-slate-900 dark:text-slate-200 transition-colors duration-200 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-l border-slate-700 flex flex-col z-20 shrink-0">
        <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-700">
            <i class="fas fa-briefcase text-brand-blueLt text-xl"></i>
            <h1 class="text-lg font-black tracking-tight text-white">Sales<span class="text-brand-blueLt"> CRM</span></h1>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="window.location.href='sales_crm.html'" id="nav-leads" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm bg-brand-blue/20 text-brand-blueLt transition-all">
                <i class="fas fa-users w-5 text-center"></i> العملاء (Leads)
            </button>
            <button onclick="window.location.href='sales_analytics.html'" id="nav-analytics" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition-all">
                <i class="fas fa-chart-line w-5 text-center"></i> التحليلات
            </button>
            <button onclick="window.location.href='sales_reports.html'" id="nav-reports" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition-all">
                <i class="fas fa-file-invoice w-5 text-center"></i> التقارير
            </button>
            
            <!-- Admin Only Option -->
            <button onclick="window.location.href='admin.html'" id="nav-settings" style="display: none;" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-amber-500 hover:bg-slate-700 transition-all mt-4 border border-slate-700">
                <i class="fas fa-cog w-5 text-center"></i> إدارة الصلاحيات
            </button>
        </nav>
        
        <div class="p-4 border-t border-slate-700">
            <button onclick="window.location.href='index.html'" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition-all text-white">
                <i class="fas fa-arrow-right"></i> الرجوع للنظام الرئيسي
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-900">
        <!-- Header -->
        <header class="h-16 bg-slate-800/50 backdrop-blur border-b border-slate-700 flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-4">
                <h2 id="page-title" class="text-xl font-black text-white">إدارة العملاء</h2>
                <div class="h-6 w-px bg-slate-700"></div>
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors" title="تبديل المظهر">
                    <i id="theme-icon" class="fas fa-sun text-sm"></i>
                </button>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-left">
                    <p id="user-name" class="text-sm font-bold text-white">Loading...</p>
                    <p id="user-role" class="text-[10px] text-brand-blueLt font-bold uppercase">CRM Agent</p>
                </div>
                <img id="user-avatar" src="" class="w-9 h-9 rounded-full object-cover bg-slate-700 border border-slate-600">
            </div>
        </header>

        <!-- Dynamic Tabs Container -->
        <div class="flex-1 overflow-auto custom-scrollbar p-6" id="main-container">
            
            <!-- Leads Tab (Notion Table) -->
            <div id="tab-leads" class="h-full flex flex-col">
                <div class="flex items-center justify-between mb-4 shrink-0">
                    <div class="flex items-center gap-2">
                        <button class="px-4 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-sm font-bold hover:bg-slate-700 transition">كل العملاء</button>
                        <button class="px-4 py-1.5 rounded-lg bg-transparent text-slate-400 text-sm font-bold hover:bg-slate-800 transition">متابعة اليوم</button>
                        <button class="px-4 py-1.5 rounded-lg bg-transparent text-slate-400 text-sm font-bold hover:bg-slate-800 transition">العملاء الجدد</button>
                    </div>
                    <button class="px-4 py-2 bg-brand-blue hover:bg-brand-blueLt text-white rounded-lg text-sm font-bold shadow-md transition-colors flex items-center gap-2">
                        <i class="fas fa-plus"></i> إضافة عميل
                    </button>
                </div>
                
                <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-auto custom-scrollbar flex-1 shadow-sm">
                    <table class="crm-table">
                        <thead>
                            <tr>
                                <th><i class="fas fa-building ms-1"></i> الشركة</th>
                                <th><i class="fas fa-user ms-1"></i> شخص التواصل</th>
                                <th><i class="fas fa-calendar ms-1"></i> تاريخ التواصل الأول</th>
                                <th><i class="fas fa-phone ms-1"></i> الهاتف</th>
                                <th><i class="fas fa-tags ms-1"></i> حالة العميل</th>
                                <th><i class="fas fa-project-diagram ms-1"></i> المشروع المطلوب</th>
                                <th><i class="fas fa-money-bill ms-1"></i> القيمة</th>
                                <th><i class="fas fa-calendar-check ms-1"></i> الإجراء التالي</th>
                            </tr>
                        </thead>
                        <tbody id="crm-table-body">
                            <!-- Dummy Data populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Other Tabs (Hidden by default) -->
            <div id="tab-analytics" class="hidden h-full flex flex-col items-center justify-center text-slate-500">
                <i class="fas fa-chart-pie text-6xl mb-4 opacity-50"></i>
                <h2 class="text-2xl font-bold">التحليلات قريباً</h2>
            </div>
            
            <div id="tab-reports" class="hidden h-full flex flex-col items-center justify-center text-slate-500">
                <i class="fas fa-file-invoice text-6xl mb-4 opacity-50"></i>
                <h2 class="text-2xl font-bold">التقارير قريباً</h2>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // Light/Dark Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            
            // Adjust specific classes based on theme
            const body = document.body;
            const aside = document.querySelector('aside');
            const header = document.querySelector('header');
            const main = document.querySelector('main');
            
            if (isDark) {
                document.getElementById('theme-icon').className = 'fas fa-sun text-sm';
                body.classList.add('bg-slate-900', 'text-slate-200'); body.classList.remove('bg-slate-50', 'text-slate-800');
                aside.classList.add('bg-slate-800', 'border-slate-700'); aside.classList.remove('bg-white', 'border-slate-200');
                header.classList.add('bg-slate-800/50', 'border-slate-700'); header.classList.remove('bg-white/80', 'border-slate-200');
                main.classList.add('bg-slate-900'); main.classList.remove('bg-slate-50');
            } else {
                document.getElementById('theme-icon').className = 'fas fa-moon text-sm';
                body.classList.remove('bg-slate-900', 'text-slate-200'); body.classList.add('bg-slate-50', 'text-slate-800');
                aside.classList.remove('bg-slate-800', 'border-slate-700'); aside.classList.add('bg-white', 'border-slate-200');
                header.classList.remove('bg-slate-800/50', 'border-slate-700'); header.classList.add('bg-white/80', 'border-slate-200');
                main.classList.remove('bg-slate-900'); main.classList.add('bg-slate-50');
            }
            
            // Re-render table if needed
            renderDummyData();
        }

        function switchTab(tabId) {
            document.querySelectorAll('#main-container > div').forEach(el => {
                el.classList.add('hidden');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-link').forEach(el => {
                el.className = 'nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all text-slate-400 hover:bg-slate-700 hover:text-slate-200';
                if (!document.documentElement.classList.contains('dark')) {
                    el.className = 'nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all text-slate-500 hover:bg-slate-100 hover:text-slate-900';
                }
            });
            
            const activeBtn = document.getElementById('nav-' + tabId);
            activeBtn.className = 'nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all bg-brand-blue/20 text-brand-blueLt';
            
            const titles = { 'leads': 'إدارة العملاء', 'analytics': 'التحليلات البيانية', 'reports': 'تقارير المبيعات' };
            document.getElementById('page-title').innerText = titles[tabId];
        }

        // Dummy Data Render
        const dummyLeads = [
            { company: 'شركة الأفق المحدودة', person: 'أحمد محمد', date: '2023-10-12', phone: '0501234567', status: 'جديد', project: 'تطوير موقع ويب', value: '15,000 ر.س', nextAction: 'مكالمة ترحيبية (غداً)' },
            { company: 'مؤسسة البناء الحديث', person: 'خالد عبد الله', date: '2023-10-10', phone: '0559876543', status: 'قيد التفاوض', project: 'تطبيق جوال', value: '35,000 ر.س', nextAction: 'إرسال العرض المالي' },
            { company: 'عيادات الابتسامة', person: 'د. سارة فهد', date: '2023-10-05', phone: '0541112233', status: 'تم الإغلاق', project: 'نظام إدارة حجوزات', value: '25,000 ر.س', nextAction: 'توقيع العقد' },
        ];
        
        function renderDummyData() {
            const isDark = document.documentElement.classList.contains('dark');
            const statusColors = {
                'جديد': 'bg-blue-500/20 text-blue-500',
                'قيد التفاوض': 'bg-amber-500/20 text-amber-500',
                'تم الإغلاق': 'bg-emerald-500/20 text-emerald-500'
            };
            
            const tbody = document.getElementById('crm-table-body');
            tbody.innerHTML = dummyLeads.map(l => `
                <tr class="cursor-pointer transition-colors">
                    <td class="font-bold">${l.company}</td>
                    <td>${l.person}</td>
                    <td>${l.date}</td>
                    <td dir="ltr" class="text-right">${l.phone}</td>
                    <td><span class="chip ${statusColors[l.status] || 'bg-slate-500/20 text-slate-500'}">${l.status}</span></td>
                    <td>${l.project}</td>
                    <td class="font-bold text-emerald-500">${l.value}</td>
                    <td class="text-xs font-bold">${l.nextAction}</td>
                </tr>
            `).join('');
        }
        
        // Initial setup
        renderDummyData();
        
        // Authentication Check
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.replace('index.html'); return; }
            try {
                const doc = await db.collection('users').doc(user.email.toLowerCase().trim()).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (!data.permissions || !data.permissions.crm) {
                        Swal.fire({ icon:'error', title:'غير مصرح', text:'ليس لديك صلاحية للدخول لنظام المبيعات.', allowOutsideClick: false }).then(() => {
                            window.location.replace('index.html');
                        });
                        return;
                    }
                    document.getElementById('user-name').innerText = data.name || user.email;
                    document.getElementById('user-role').innerText = `CRM ${data.permissions.crmRole || 'Agent'}`;
                    if(data.permissions.crmRole === 'admin') {
                        document.getElementById('nav-settings').style.display = 'flex';
                    }
                }
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
