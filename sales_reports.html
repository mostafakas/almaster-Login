<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Reports - Almaster</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            blueLt: '#3b82f6',
                            navy: '#0f172a',
                            navy2: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #64748b; }

        /* Notion-like Table Styles */
        .crm-table { border-collapse: collapse; width: 100%; text-align: left; }
        .crm-table th, .crm-table td { 
            border: 1px solid theme('colors.slate.700'); 
            padding: 10px 14px; 
            white-space: nowrap; 
        }
        .crm-table th {
            background: theme('colors.slate.800');
            color: theme('colors.slate.300');
            font-weight: 700;
            font-size: 13px;
        }
        .crm-table tr:hover { background: theme('colors.slate.800/50'); }
        .crm-table td { font-size: 13px; color: theme('colors.slate.200'); }

        /* Light mode overrides */
        html:not(.dark) .crm-table th, html:not(.dark) .crm-table td { border-color: theme('colors.slate.200'); }
        html:not(.dark) .crm-table th { background: theme('colors.slate.100'); color: theme('colors.slate.600'); }
        html:not(.dark) .crm-table tr:hover { background: theme('colors.slate.50'); }
        html:not(.dark) .crm-table td { color: theme('colors.slate.700'); }
        
        .chip { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-200 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col z-20 shrink-0">
        <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-200 dark:border-slate-700">
            <i class="fas fa-briefcase text-brand-blueLt text-xl"></i>
            <h1 class="text-lg font-black tracking-tight text-slate-800 dark:text-white">Sales<span class="text-brand-blueLt"> CRM</span></h1>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="window.location.href='sales_crm.html'" id="nav-leads" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-slate-200 transition-all">
                <i class="fas fa-users w-5 text-center"></i> Leads
            </button>
            <button onclick="window.location.href='sales_analytics.html'" id="nav-analytics" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-slate-200 transition-all">
                <i class="fas fa-chart-line w-5 text-center"></i> Analytics
            </button>
            <button onclick="window.location.href='sales_reports.html'" id="nav-reports" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm bg-brand-blue/10 dark:bg-brand-blue/20 text-brand-blueLt transition-all">
                <i class="fas fa-file-invoice w-5 text-center"></i> Reports
            </button>
            
            <!-- Admin Only Option -->
            <button onclick="window.location.href='admin.html'" id="nav-settings" style="display: none;" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all mt-4 border border-slate-200 dark:border-slate-700">
                <i class="fas fa-cog w-5 text-center"></i> Manage Access
            </button>
        </nav>
        
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">
            <button onclick="window.location.href='index.html'" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-xs font-bold transition-all text-slate-800 dark:text-white">
                <i class="fas fa-arrow-left"></i> Main System
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 dark:bg-slate-900">
        <!-- Header -->
        <header class="h-16 bg-white/80 dark:bg-slate-800/50 backdrop-blur border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-4">
                <h2 id="page-title" class="text-xl font-black text-slate-800 dark:text-white">Sales Reports</h2>
                <div class="h-6 w-px bg-slate-300 dark:bg-slate-700"></div>
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors" title="Toggle Theme">
                    <i id="theme-icon" class="fas fa-sun text-sm"></i>
                </button>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="user-name" class="text-sm font-bold text-slate-800 dark:text-white">Loading...</p>
                    <p id="user-role" class="text-[10px] text-brand-blueLt font-bold uppercase">CRM Agent</p>
                </div>
                <img id="user-avatar" src="" class="w-9 h-9 rounded-full object-cover bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600" onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'">
            </div>
        </header>

        <!-- Dynamic Tabs Container -->
        <div class="flex-1 overflow-auto custom-scrollbar p-6" id="main-container">
            
            <!-- Reports Dashboard -->
            <div id="tab-reports" class="h-full flex flex-col gap-6">
                <!-- Filters Bar -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-xl shadow-sm shrink-0 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-2">
                            <label class="text-sm font-bold text-slate-500 dark:text-slate-400">From:</label>
                            <input type="date" id="filter-date-from" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 text-sm rounded-lg p-2 focus:border-brand-blueLt outline-none">
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-sm font-bold text-slate-500 dark:text-slate-400">To:</label>
                            <input type="date" id="filter-date-to" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 text-sm rounded-lg p-2 focus:border-brand-blueLt outline-none">
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-sm font-bold text-slate-500 dark:text-slate-400">Status:</label>
                            <select id="filter-status" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 text-sm rounded-lg p-2 focus:border-brand-blueLt outline-none min-w-[120px]">
                                <option value="all">All</option>
                                <option value="Closed (Won)">Closed (Won)</option>
                                <option value="Negotiation">Negotiation</option>
                                <option value="Lost">Lost</option>
                                <option value="New">New</option>
                            </select>
                        </div>
                        <button onclick="renderReports()" class="px-4 py-2 bg-brand-blue/10 dark:bg-brand-blue/20 text-brand-blueLt hover:bg-brand-blue hover:text-white rounded-lg text-sm font-bold transition-colors">
                            <i class="fas fa-filter"></i> Filter
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white rounded-lg text-sm font-bold transition-colors flex items-center gap-2">
                            <i class="fas fa-file-pdf text-red-500 dark:text-red-400"></i> PDF
                        </button>
                        <button class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white rounded-lg text-sm font-bold transition-colors flex items-center gap-2">
                            <i class="fas fa-file-excel text-emerald-600 dark:text-emerald-400"></i> Excel
                        </button>
                    </div>
                </div>

                <!-- Reports Table -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-auto custom-scrollbar flex-1 shadow-sm">
                    <table class="crm-table w-full">
                        <thead>
                            <tr>
                                <th>Report ID</th>
                                <th>Client Name</th>
                                <th>Assigned To</th>
                                <th>Closing Date</th>
                                <th>Duration</th>
                                <th>Deal Status</th>
                                <th>Financial Value</th>
                            </tr>
                        </thead>
                        <tbody id="reports-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Summary Bar -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-xl shadow-sm shrink-0 flex items-center justify-between">
                    <span class="text-sm font-bold text-slate-500 dark:text-slate-400">Total value of current report:</span>
                    <span id="report-total-val" class="text-xl font-black text-emerald-500">0 SAR</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // Firebase Config injection
        const firebaseConfig = { apiKey: "AIzaSyCXyuT529aGwiS5j_RPxW_zEeAtkYc7JlM", authDomain: "almaster-b8c18.firebaseapp.com", projectId: "almaster-b8c18", storageBucket: "almaster-b8c18.firebasestorage.app", messagingSenderId: "884142036232", appId: "1:884142036232:web:eeb6677d988565653a08bd" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Light/Dark Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-sun text-sm' : 'fas fa-moon text-sm';
            renderReports(); // Re-render table if needed
        }

        // Reports Logic
        let leadsData = [];
        
        function initReports() {
            db.collection('sales_leads').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                leadsData = [];
                snapshot.forEach(doc => {
                    leadsData.push({ id: doc.id, ...doc.data() });
                });
                renderReports();
            }, error => {
                console.error("Error fetching reports: ", error);
            });
        }
        
        function renderReports() {
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;
            const statusFilter = document.getElementById('filter-status').value;
            
            const tbody = document.getElementById('reports-table-body');
            
            let filtered = leadsData.filter(lead => {
                // Legacy mapping for filtering logic
                let leadStatus = lead.status || 'New';
                if(leadStatus === 'جديد') leadStatus = 'New';
                if(leadStatus === 'قيد التفاوض') leadStatus = 'Negotiation';
                if(leadStatus === 'مغلق (نجاح)') leadStatus = 'Closed (Won)';
                if(leadStatus === 'مستبعد (خسارة)') leadStatus = 'Lost';

                if(statusFilter !== 'all' && leadStatus !== statusFilter) return false;
                
                let contactDateStr = lead.firstContactDate ? lead.firstContactDate.split('T')[0] : null;
                if(dateFrom && contactDateStr && contactDateStr < dateFrom) return false;
                if(dateTo && contactDateStr && contactDateStr > dateTo) return false;
                
                return true;
            });
            
            const statusColors = {
                'New': 'bg-blue-500/20 text-blue-500',
                'Negotiation': 'bg-amber-500/20 text-amber-500',
                'Closed (Won)': 'bg-emerald-500/20 text-emerald-500',
                'Lost': 'bg-red-500/20 text-red-500'
            };
            
            let totalVal = 0;
            let closedCount = 0;
            
            tbody.innerHTML = filtered.map((l, index) => {
                let leadStatus = l.status || 'New';
                if(leadStatus === 'جديد') leadStatus = 'New';
                if(leadStatus === 'قيد التفاوض') leadStatus = 'Negotiation';
                if(leadStatus === 'مغلق (نجاح)') leadStatus = 'Closed (Won)';
                if(leadStatus === 'مستبعد (خسارة)') leadStatus = 'Lost';

                const isClosed = leadStatus === 'Closed (Won)';
                if(isClosed) {
                    totalVal += Number(l.value || 0);
                    closedCount++;
                }
                
                const cColor = statusColors[leadStatus] || 'bg-slate-500/20 text-slate-500';
                const dateStr = l.lastFollowUp ? new Date(l.lastFollowUp).toLocaleDateString('en-US') : '-';
                
                return `
                <tr class="cursor-pointer transition-colors">
                    <td>#REP-${index + 1000}</td>
                    <td class="font-bold">${l.company || '-'}</td>
                    <td>${l.assignedEmployee || '-'}</td>
                    <td>${dateStr}</td>
                    <td>-</td>
                    <td><span class="chip ${cColor}">${leadStatus}</span></td>
                    <td class="font-bold ${isClosed ? 'text-emerald-500' : ''}">${l.value || 0} ${l.currency || 'SAR'}</td>
                </tr>
            `}).join('');
            
            if(filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-slate-500">No reports found for the selected period</td></tr>';
            }
            
            document.getElementById('report-total-val').innerText = totalVal.toLocaleString() + ' SAR';
        }
        
        // Authentication Check
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.replace('index.html'); return; }
            try {
                const doc = await db.collection('users').doc(user.email.toLowerCase().trim()).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (!data.permissions || !data.permissions.crm) {
                        Swal.fire({ icon:'error', title:'Unauthorized', text:'You do not have permission to access the CRM.', allowOutsideClick: false }).then(() => {
                            window.location.replace('index.html');
                        });
                        return;
                    }
                    const userName = data.name || user.email.split('@')[0];
                    document.getElementById('user-name').innerText = userName;
                    document.getElementById('user-role').innerText = `CRM ${data.permissions.crmRole || 'Agent'}`;
                    document.getElementById('user-avatar').src = data.profileImage || `https://ui-avatars.com/api/?name=${userName}&background=random`;

                    if(data.permissions.crmRole === 'admin') {
                        document.getElementById('nav-settings').style.display = 'flex';
                    }
                    initReports();
                }
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
